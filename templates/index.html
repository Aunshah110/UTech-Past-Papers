<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTech Papers — Department of Computer Science</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

    <!-- ===== Background ===== -->
    <div class="page-bg"></div>

    <!-- ===== Top Navigation ===== -->
    <nav class="navbar">
        <div class="nav-inner">
        
            <!-- LEFT: logo + "PAST PAPERS" -->
            <div class="nav-brand">
                <div class="brand-logo">
                    <img src="{{ url_for('static', filename='images/uni_logo.png') }}" alt="University Logo">
                </div>
                <span class="brand-line">Past Papers</span>
            </div>
        
            <!-- CENTER: name pill + icons on the same line -->
            <div class="nav-center">
                <span class="nav-name">Syed Aun Muhammed</span>
                <div class="nav-icons">
                    <a href="https://linkedin.com/in/syed-aun-muhammad-370487223" target="_blank" rel="noopener" class="nav-icon" aria-label="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a href="https://github.com/Aunshah110" target="_blank" rel="noopener" class="nav-icon" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    {% if request.endpoint != 'index' %}
                    <a href="/" class="nav-icon" aria-label="Home">
                        <i class="fas fa-home"></i>
                    </a>
                    {% endif %}
                </div>
            </div>
        
            <!-- RIGHT: empty spacer to keep the grid balanced -->
            <div class="nav-spacer"></div>
        
        </div>
    </nav>

    <!-- ===== Hero Titles (cursor-tracked slide) ===== -->
    <header class="hero-titles">
        <h1 class="slide-title" data-text="UTech Papers">UTech Papers</h1>
        <h2 class="slide-title sub" data-text="Department of Computer Science">Department of Computer Science</h2>
    </header>

    <!-- ===== Search ===== -->
    <section class="search-section">
        <div class="container">
            <div class="search-wrap">
                <i class="fas fa-search search-icon"></i>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search by course name or code…"
                    autocomplete="off"
                >
                <button id="clearSearchBtn" class="clear-btn" aria-label="Clear">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <p class="search-stats" id="searchStats">Showing all courses</p>
        </div>
    </section>

    <!-- ===== Courses Grid ===== -->
    <main class="courses-section">
        <div class="container">
            <div id="loadingSpinner" class="loading" style="display:none;">
                <i class="fas fa-spinner fa-spin"></i>
                <span>Loading courses…</span>
            </div>

            <div id="coursesGrid" class="courses-grid"></div>

            <div id="noResults" class="no-results" style="display:none;">
                <i class="fas fa-search"></i>
                <h3>No courses found</h3>
                <p>Try a different course name or code.</p>
            </div>

            <div id="loadMoreContainer" class="load-more-wrap" style="display:none;">
                <button id="loadMoreBtn" class="load-more-btn">Load More</button>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
